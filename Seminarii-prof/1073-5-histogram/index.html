<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histogram</title>
</head>
<body>
    <canvas id="image-canvas">
        Your browser does not support the canvas element.
    </canvas>
    <canvas id="histogram-canvas">
        Your browser does not support the canvas element.
    </canvas>
    <script type="module">
        import {BarChart} from './canvas-bar-chart-library.js';

        // Selectors
        const imageCanvas = document.getElementById('image-canvas');
        const histogramCanvas = document.getElementById('histogram-canvas');

        //
        const barChart = new BarChart(histogramCanvas);

        // Events
        //https://developer.mozilla.org/en-US/docs/Web/API/HTML_Drag_and_Drop_API

        document.addEventListener('dragover', (e)=>{
            e.preventDefault();
        });

        document.addEventListener('drop', (e)=>{
            e.preventDefault();

            const files = e.dataTransfer.files;

            if(files.length > 0){
                const file = files[0];
                
                const fileReader = new FileReader();
                fileReader.addEventListener('load', ()=>{
                    const dataUrl = fileReader.result;
                    const img = document.createElement('img');
                    img.addEventListener('load', ()=>{
                        imageCanvas.width = img.naturalWidth;
                        imageCanvas.height = img.naturalHeight;
                        const context = imageCanvas.getContext('2d');
                        context.drawImage(img, 0, 0);

                        drawImageHistogram();
                    })
                    img.addEventListener('error', ()=>{
                        console.error('Could not load image');
                    });
                    img.src = dataUrl;
                });
                fileReader.addEventListener('error', ()=>
                {
                    console.error('Could not read file.');
                })
                fileReader.readAsDataURL(file);
            }
        });

        function drawImageHistogram(){
            const context = imageCanvas.getContext('2d');
            const imageData = context.getImageData(0, 0, imageCanvas.width, imageCanvas.height);
            const data = imageData.data;
            const bins = calculateHistogram(data);
            barChart.draw(bins);
        }

        function calculateHistogram(data){
            // 1) Create an array with 256 elements, all 0
            const bins = new Array(256).fill(0);

            // 2) Compute the values
            for(let i = 0; i < data.length; i+=4){
                const r = data[i];
                const g = data[i+1];
                const b = data[i+2];
                //const a = data[i+3];

                const intensity = Math.round((r+g+b)/3);
                bins[intensity]++;

                // bins[r]++;
            }

            return bins;
        }
    </script>
</body>
</html>
