<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Bar Chart</title>
    <style>
        .bar {
            fill: orange;
        }
        .bar:hover {
            fill: orangered;
        }
    </style>
</head>
<body>
    <div id="chart-div" style="width: 600px; height: 400px;"></div>

    <script type="module">
        import {BarChart} from './svg-bar-chart-library.js';

        const data = [
            ['Label 1', 1],
            ['Label 2', 2],
            ['Label 3', 3]
        ]

        const barChart = new BarChart(document.getElementById('chart-div'));
        barChart.draw(data);
    </script>
</body>
</html>
