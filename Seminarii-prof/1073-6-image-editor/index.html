<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Editor</title>
</head>
<body>
    <canvas id="visible-canvas">
        Your browser does not support the canvas element.
    </canvas>

    <input id="file-browser" type="file" accept="image/*">

    <div>
        <button type="button" data-effect="normal">Normal</button>
        <button type="button" data-effect="grayscale">Grayscale</button>
        <button type="button" data-effect="sepia">Sepia</button>
    </div>

    <script type="module">
        import {ImageEditor} from './image-editor.js';

        const visibleCanvas = document.getElementById('visible-canvas');
        const imageEditor = new ImageEditor(visibleCanvas);

        const buttons = document.querySelectorAll('[data-effect]');
        for(let i = 0; i < buttons.length; i++){
            buttons[i].addEventListener('click', function(){
                //console.log(this.dataset.effect);
                imageEditor.changeEffect(this.dataset.effect);
            })
        }

        document.getElementById('file-browser').addEventListener('change', (e)=>{

            const files = e.target.files;
            if (files.length > 0){
                const file = files[0];
                //console.log(file);

                const reader = new FileReader();
                reader.addEventListener('load', ()=>{
                    const dataUrl = reader.result;
                    const img = document.createElement('img');
                    img.addEventListener('load', ()=>{
                        //console.log(img.naturalWidth)
                        imageEditor.changeImage(img);
                    });
                    img.addEventListener('error', ()=>{
                        console.error('Error loading image');
                    })
                    img.src = dataUrl;
                })
                reader.addEventListener('error', ()=>{
                    console.error('Error reading file');
                })
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
