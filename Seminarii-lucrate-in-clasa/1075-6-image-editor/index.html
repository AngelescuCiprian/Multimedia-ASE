<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Editor</title>
</head>
<body>
    <canvas id="visible-canvas">
        Your browser does not support the canvas element.
    </canvas>

    <input type="file" id="file-browser" accept="image/*">

    <div>
        <button type="button" data-effect="normal">Normal</button>
        <button type="button" data-effect="grayscale">Grayscale</button>
        <button type="button" data-effect="sepia">Sepia</button>
    </div>

    <script type="module">
        import {ImageEditor} from './image-editor.js'
        const visibleCanvas = document.getElementById('visible-canvas');
        const imageEditor=new ImageEditor(visibleCanvas)


        const buttons = document.querySelectorAll('[data-effect]');
        for(let i = 0; i < buttons.length; i++){
            buttons[i].addEventListener('click',(ev)=>
        {
            // console.log(ev.target.dataset.effect)
            imageEditor.changeEffect(ev.target.dataset.effect);
        })
            
        }
        document.getElementById('file-browser').addEventListener('change',(ev)=>
    {
        const files=ev.target.files;
        if(files.length>0)
    {
        const file=files[0];
        console.log(file);
        const reader=new FileReader();
        reader.addEventListener('load',()=>
    {
        const dataUrl=reader.result
        console.log(dataUrl)
        const img=document.createElement('img');
        img.addEventListener('load',()=>
    {
        imageEditor.changeImage(img)
    })
        img.addEventListener('error',()=>
    {
        console.error('Eroare could not laod image')
    })
        img.src=dataUrl
    })
       reader.addEventListener('error',()=>
    {
        console.error('Eroare')
    })
        reader.readAsDataURL(file);
    }
    })
    </script>
</body>
</html>
